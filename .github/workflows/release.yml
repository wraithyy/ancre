name: Release

# Tag-driven releases: push a tag `vX.Y.Z` and this builds a universal
# (arm64 + x86_64) ancre.app + ancrectl, zips them, and publishes a GitHub
# Release with auto-generated notes. The job summary prints the sha256 and
# Release with auto-generated notes, then bumps the Homebrew cask
# (wraithyy/homebrew-tap, Casks/ancre.rb).

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Stamp version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION" Scripts/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $VERSION" Scripts/Info.plist
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Build universal bundle
        run: Scripts/bundle.sh universal

      - name: Package
        run: |
          STAGE="$(mktemp -d)"
          cp -R .build/ancre.app "$STAGE/"
          cp .build/universal/ancrectl "$STAGE/"
          (cd "$STAGE" && ditto -c -k . "$GITHUB_WORKSPACE/ancre-$VERSION-macos.zip")
          shasum -a 256 "ancre-$VERSION-macos.zip" | tee checksum.txt

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "ancre-$VERSION-macos.zip" \
            --title "ancre $VERSION" \
            --generate-notes

      # Pushes the version+sha straight into the tap. Needs the
      # HOMEBREW_TAP_TOKEN secret (fine-grained PAT, contents:write on
      # wraithyy/homebrew-tap); without it the run only prints the bump.
      - name: Bump Homebrew cask
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          SHA=$(cut -d' ' -f1 checksum.txt)
          if [ -z "$GH_TOKEN" ]; then
            {
              echo "## Homebrew cask bump — no HOMEBREW_TAP_TOKEN, do it by hand"
              echo '```ruby'
              echo "  version \"$VERSION\""
              echo "  sha256 \"$SHA\""
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git clone --depth 1 \
            "https://x-access-token:$GH_TOKEN@github.com/wraithyy/homebrew-tap.git" tap
          cd tap
          sed -i '' -e "s|version \".*\"|version \"$VERSION\"|" \
                    -e "s|sha256 \".*\"|sha256 \"$SHA\"|" Casks/ancre.rb
          if git diff --quiet; then
            echo "cask already at $VERSION"
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -am "ancre $VERSION"
          git push
          echo "## Homebrew cask bumped to $VERSION" >> "$GITHUB_STEP_SUMMARY"
