name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['website/**', 'docs/**', '**.md']
  pull_request:
    paths-ignore: ['website/**', 'docs/**', '**.md']

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Cache SPM dependencies
        uses: actions/cache@v4
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ hashFiles('Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-
      - name: Build
        run: swift build
      - name: Test
        run: swift test
      - name: Bundle
        run: Scripts/bundle.sh
