# applland default config — copied to ~/.config/applland/applland.toml on first run

[general]
gaps-inner = 8
gaps-outer = 8
animations = true
animation-duration-ms = 180
# Apps that always place instantly (animate badly):
# animations-exclude = ["com.microsoft.teams2"]
default-layout = "dwindle"   # dwindle | scroll

[hyper]
# Physical key remapped to act as the hyper modifier.
key = "caps_lock"

[keybindings]
"hyper-h" = "focus left"
"hyper-j" = "focus down"
"hyper-k" = "focus up"
"hyper-l" = "focus right"
"hyper-shift-h" = "move left"
"hyper-shift-j" = "move down"
"hyper-shift-k" = "move up"
"hyper-shift-l" = "move right"
"hyper-left" = "resize width -50"
"hyper-right" = "resize width +50"
"hyper-up" = "resize height +50"
"hyper-down" = "resize height -50"
"hyper-1" = "workspace 1"
"hyper-2" = "workspace 2"
"hyper-3" = "workspace 3"
"hyper-4" = "workspace 4"
"hyper-5" = "workspace 5"
"hyper-6" = "workspace 6"
"hyper-7" = "workspace 7"
"hyper-8" = "workspace 8"
"hyper-9" = "workspace 9"
"hyper-shift-1" = "move-to-workspace 1"
"hyper-shift-2" = "move-to-workspace 2"
"hyper-shift-3" = "move-to-workspace 3"
"hyper-shift-4" = "move-to-workspace 4"
"hyper-shift-5" = "move-to-workspace 5"
"hyper-shift-6" = "move-to-workspace 6"
"hyper-shift-7" = "move-to-workspace 7"
"hyper-shift-8" = "move-to-workspace 8"
"hyper-shift-9" = "move-to-workspace 9"
"hyper-v" = "toggle-floating"
"hyper-f" = "toggle-fullscreen"
"hyper-a" = "adopt-window"
"hyper-t" = "layout scroll"
"hyper-shift-t" = "layout dwindle"
"hyper-comma" = "focus-monitor previous"
"hyper-period" = "focus-monitor next"

# Pin workspaces to a display. The value is either the stable monitor id
# (vendor:model:serial, logged at startup) or part of the display name.
# Unlisted workspaces are spread over the remaining displays; a workspace whose
# display is disconnected moves to a connected one and returns on replug.
[workspaces]
# "1" = "Built-in"
# "9" = "P34w-20"

# [[rules]] — Milestone 6

[bar]
enabled = true
position = "top"
# Pill background opacity 0..1 and bar strip height in points.
opacity = 0.35
height = 28
# Pill placement: align = "center" | "left" | "right"; offset-x shifts the
# pill along that edge, offset-y pushes the strip away from the screen edge.
align = "center"
offset-x = 0
offset-y = 0
# icon-size = 17
# Overrides of [theme] just for the bar:
# background-color = "#1e1e2eCC"
# accent-color = "#89b4fa"

# Keybind cheatsheet: hold hyper past delay-ms to show a translucent overlay
# with all keybindings; released hyper hides it.
# [help]
# enabled = true
# delay-ms = 2000
# opacity = 0.85

# Shared colors ("#RRGGBB" / "#RRGGBBAA"); absent = system accent/material.
# [theme]
# accent = "#89b4fa"
# background = "#1e1e2eCC"

# Focus border around the focused window.
# [border]
# enabled = true
# color = "#89b4fa"   # default: theme accent
# width = 2
# radius = 6

# Per-workspace bar appearance + layout. All keys optional.
# layout: "dwindle" | "scroll" | a [custom-layouts] name.
# [workspace-labels]
# "1" = { icon = "🌐", name = "web", show-number = false, layout = "scroll" }
# "2" = { name = "code", hide-when-empty = true }

# Custom layouts: h(...) = side by side, v(...) = stacked, * = window slot.
# Windows fill slots in order; extras stack into the last slot.
# [custom-layouts]
# "master" = "h(0.6, *, v(0.5, *, *))"

# New windows of an app go straight to a workspace (bundle id -> workspace).
# [app-workspaces]
# "com.spotify.client" = "9"
# "com.microsoft.teams2" = "5"
